<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" font-family="Helvetica,Arial,sans-serif" font-size="11">
<rect x="0" y="0" width="720" height="420" fill="white"/>
<text x="360" y="30" text-anchor="middle" font-size="13" font-weight="bold">Misspecification boundary and abstention (section 10.2)</text>
<text x="360" y="48" text-anchor="middle" font-size="10" fill="#666">valid registered assumptions yield PROCEED; any broken assumption abstains as NOT_ESTABLISHED (no force-fit)</text>

<!-- PROCEED branch -->
<rect x="60" y="80" width="260" height="66" rx="6" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
<text x="190" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#276749">Valid profile</text>
<text x="190" y="118" text-anchor="middle" font-size="9" fill="#276749">registered finite model +</text>
<text x="190" y="132" text-anchor="middle" font-size="9" fill="#276749">authorized coupling (product law)</text>
<rect x="60" y="160" width="260" height="40" rx="6" fill="#e6fffa" stroke="#2c7a7b" stroke-width="1.5"/>
<text x="190" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c7a7b">PROCEED</text>
<text x="60" y="92" text-anchor="middle" font-size="9"> </text>

<!-- violations -->
<rect x="400" y="80" width="260" height="146" rx="6" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
<text x="530" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#c53030">Assumption violations (6)</text>
<text x="530" y="122" text-anchor="middle" font-size="9" fill="#333">action_changes_state</text>
<text x="530" y="137" text-anchor="middle" font-size="9" fill="#333">omitted_third_state</text>
<text x="530" y="152" text-anchor="middle" font-size="9" fill="#333">unregistered_nuisance</text>
<text x="530" y="167" text-anchor="middle" font-size="9" fill="#333">unknown_dependency_unit</text>
<text x="530" y="182" text-anchor="middle" font-size="9" fill="#333">no_complete_obs_model</text>
<text x="530" y="197" text-anchor="middle" font-size="9" fill="#333">dependent_observations</text>
<rect x="400" y="160" width="0" height="0" />
<rect x="400" y="240" width="260" height="40" rx="6" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
<text x="530" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#c53030">abstain: NOT_ESTABLISHED</text>

<!-- arrows -->
<line x1="190" y1="146" x2="190" y2="158" stroke="#276749" stroke-width="2"/>
<line x1="530" y1="226" x2="530" y2="238" stroke="#c53030" stroke-width="2"/>
<text x="360" y="120" text-anchor="middle" font-size="10" fill="#666">decision</text>
<text x="360" y="136" text-anchor="middle" font-size="10" fill="#666">boundary</text>

<!-- bottom note -->
<text x="360" y="330" text-anchor="middle" font-size="10" fill="#444">The certificate is only valid inside the registered finite model; there is no force-fit of</text>
<text x="360" y="346" text-anchor="middle" font-size="10" fill="#444">any broken input into the theorem-required form. This is a theory boundary and</text>
<text x="360" y="362" text-anchor="middle" font-size="10" fill="#444">credibility evidence, not real-data validation.</text>
<text x="360" y="400" text-anchor="middle" font-size="9" fill="#666">assumption_gate: valid_profile=PROCEED; violation_verdict_all=NOT_ESTABLISHED (contract 10.2)</text>
</svg>