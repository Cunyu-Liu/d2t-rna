[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "d2t-rna"
version = "0.1.0"
description = "Auditable exact risk-coverage contracts for D2T-RNA"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [
  { name = "liucunyu", email = "tylcy020509@qq.com" },
]
dependencies = [
  "pydantic>=2.10,<3",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "hypothesis>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
